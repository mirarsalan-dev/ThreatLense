<!-- Security Center Overlay -->
<div id="security-center-modal" class="cyber-window d-none" style="position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 600px; z-index: 2000;">
    <div class="cyber-window-header d-flex justify-content-between align-items-center">
        <span>● ● ● SECURITY CENTER</span>
        <button class="btn btn-sm text-danger p-0 m-0" onclick="document.getElementById('security-center-modal').classList.add('d-none')">×</button>
    </div>
    <div class="p-4" style="background: var(--bg-dark); border-bottom-left-radius: 4px; border-bottom-right-radius: 4px;">
        <h5 class="text-info mb-4">SYSTEM SECURITY STATUS</h5>
        <div id="security-controls-list">
            <!-- Populated via JS -->
            <div class="text-center text-muted">Scanning system controls...</div>
        </div>
    </div>
</div>

<script>
    function openSecurityCenter() {
        const modal = document.getElementById('security-center-modal');
        modal.classList.remove('d-none');
        
        fetch('/api/security/health')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const list = document.getElementById('security-controls-list');
                    list.innerHTML = '';
                    
                    const controls = data.data;
                    for (const [key, val] of Object.entries(controls)) {
                        const row = document.createElement('div');
                        row.className = 'd-flex justify-content-between border-bottom border-secondary pb-2 mb-2';
                        
                        const label = document.createElement('span');
                        label.className = 'text-uppercase text-secondary';
                        label.innerText = key.replace('_', ' ');
                        
                        const status = document.createElement('span');
                        status.className = `text-${val.severity} fw-bold`;
                        status.innerText = `[ ${val.status} ]`;
                        
                        row.appendChild(label);
                        row.appendChild(status);
                        row.appendChild(status);
                        list.appendChild(row);
                    }
                    
                    if (data.stats) {
                        const statsDiv = document.createElement('div');
                        statsDiv.className = 'mt-4 pt-3 border-top border-secondary';
                        statsDiv.innerHTML = `
                            <div class="row text-center">
                                <div class="col-6">
                                    <h6 class="text-secondary mb-1">TOTAL EVENTS</h6>
                                    <h3 class="text-info">${data.stats.recent_events}</h3>
                                </div>
                                <div class="col-6">
                                    <h6 class="text-secondary mb-1">BLOCKED THREATS</h6>
                                    <h3 class="text-danger">${data.stats.blocked_requests}</h3>
                                </div>
                            </div>
                        `;
                        list.appendChild(statsDiv);
                    }
                }
            })
            .catch(err => {
                document.getElementById('security-controls-list').innerHTML = '<div class="text-danger">Failed to fetch security status.</div>';
            });
    }
</script>
