version: '3.8'

services:
  web:
    build: .
    container_name: threatlense_web
    ports:
      - "5000:5000"
    volumes:
      - ./Backend:/app/Backend
      - ./Frontend:/app/Frontend
    env_file:
      - ./Backend/.env
    environment:
      - FLASK_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
